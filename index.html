<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Operação Tecnoval</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:#f4f6f8;color:#111}
header{background:#0f2a44;color:#fff;padding:14px 16px;position:sticky;top:0}header h1{margin:0;font-size:20px}header p{margin:2px 0 0;opacity:.85;font-size:13px}
nav{display:flex;gap:8px;overflow-x:auto;padding:10px;background:#fff;border-bottom:1px solid #ddd;position:sticky;top:60px;z-index:5}
nav button{white-space:nowrap;border:1px solid #ddd;background:#fff;padding:10px 12px;border-radius:999px;cursor:pointer;font-weight:600}
nav button.on{background:#facc15;border-color:#facc15}
main{max-width:980px;margin:0 auto;padding:14px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:14px;margin-bottom:12px}
h2{margin:0 0 8px;font-size:18px}.mut{color:#666;font-size:13px}
label{display:block;font-size:12px;font-weight:700;margin:10px 0 4px}
input,select{width:100%;padding:12px;border:1px solid #ccc;border-radius:10px;font-size:16px}
.btn{display:block;width:100%;padding:13px;border:0;border-radius:10px;background:#facc15;font-weight:800;font-size:16px;cursor:pointer;margin-top:10px}
.btn2{background:#0f2a44;color:#fff}.btnG{background:#e5e7eb}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{border-bottom:1px solid #eee;padding:8px;text-align:left}th{background:#f8fafc}
.badge{display:inline-block;background:#eef2ff;padding:3px 8px;border-radius:999px;font-size:12px}
.flex{display:flex;gap:8px}.flex button{flex:1}
@media(max-width:600px){.row{grid-template-columns:1fr}nav{top:58px}}
</style></head>
<body>
<header><h1>Operação Tecnoval</h1><p>Sistema de gestão de estoque e operações Tecnoval</p><p id="userLine" class="mut" style="color:#fff"></p></header>
<div id="login" class="card" style="max-width:480px;margin:20px auto">
<h2>Entrar</h2><label>Usuário</label><input id="lu" placeholder="Digite"><label>Senha</label><input id="lp" type="password" placeholder="Digite">
<button class="btn" onclick="doLogin()">Entrar</button><p class="mut" id="loginMsg"></p>
<p class="mut">Primeiro acesso: usuário admin — peça a senha ao administrador. Depois cadastre outros usuários em Usuários.</p>
</div>
<div id="app" style="display:none">
<nav id="tabs"></nav>
<main id="content"></main>
</div>
<script>
let DB={estoque:[],carga:[],movs:[],invs:[],users:[{u:"admin",s:"tecnoval123",nome:"Administrador",perfil:"Administrador"}]};
let curUser=null, tab="Consultar", filtro="", cargaAtual=[], inventConferidos=[];
function save(){localStorage.setItem("tecnoval_db",JSON.stringify(DB));}
function load(){try{let d=JSON.parse(localStorage.getItem("tecnoval_db")); if(d&&d.estoque&&d.estoque.length) DB=d;}catch(e){}}
function parseBR(s){if(s==null)return 0; s=String(s).trim().replace(/\./g,"").replace(",","."); let n=parseFloat(s); return isNaN(n)?0:n;}
function fmtBR(n){return Number(n||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});}
// QR: 144507;13748108;437,88;26080... => Codigo;Lote;Peso;NF  ou Codigo;Peso;Lote;NF
function parseQR(txt){
  txt=String(txt||"").trim(); if(!txt) return null;
  let parts=txt.split(/[;|\n\t]+/).map(s=>s.trim()).filter(s=>s!=="");
  if(parts.length===1 && txt.includes(",")) parts=[txt];
  if(parts.length===1) return {codigo:parts[0],lote:"",peso:"",nf:""};
  let codigo=parts[0]||"", lote="", peso="", nf="";
  // acha peso: parte com virgula
  let idxPeso=parts.findIndex((p,i)=>i>0 && p.includes(","));
  if(idxPeso>=0){ peso=parts[idxPeso]; let resto=parts.filter((_,i)=>i!==0&&i!==idxPeso); lote=resto[0]||""; nf=resto[1]||""; }
  else { lote=parts[1]||""; peso=parts[2]||""; nf=parts[3]||""; }
  return {codigo,lote,peso,nf};
}
function distribute(prefix){
  let raw=document.getElementById(prefix+"_qr").value;
  let d=parseQR(raw); if(!d) return alert("Bipe ou cole o QR");
  document.getElementById(prefix+"_codigo").value=d.codigo;
  document.getElementById(prefix+"_lote").value=d.lote;
  document.getElementById(prefix+"_peso").value=d.peso;
  document.getElementById(prefix+"_nf").value=d.nf;
  // Galpao/Bloco ficam vazios para digitar na mao
  let g=document.getElementById(prefix+"_galpao"); if(g) g.value="";
  let b=document.getElementById(prefix+"_bloco"); if(b) b.value="";
  document.getElementById(prefix+"_msg").textContent="QR distribuído: Código "+d.codigo+" • Peso "+d.peso+" • Lote "+d.lote+" • NF "+d.nf;
}
async function loadCSV(){
  load(); if(DB.estoque.length) return render();
  try{
    let r=await fetch("estoque.csv.xlsx.xlsx"); let t=await r.text(); let lines=t.split(/\r?\n/).filter(l=>l.trim());
    for(let i=1;i<lines.length;i++){let c=lines[i].split(";"); if(!c[0]) continue; DB.estoque.push({codigo:c[0],lote:c[1]||"",galpao:c[2]||"",bloco:c[3]||"",peso1:c[4]||"",peso2:c[5]||"",carga:c[6]||"",pesoBruto:c[7]||""});}
    let r2=await fetch("carga.csv.xlsx"); let t2=await r2.text(); let l2=t2.split(/\r?\n/).filter(l=>l.trim());
    for(let i=1;i<l2.length;i++){let c=l2[i].split(";"); if(!c[0]) continue; DB.carga.push({codigo:c[0],lote:c[1]||"",galpao:c[2]||"",bloco:c[3]||"",loc:c[4]||"",peso:c[5]||"",pesoBruto:c[6]||""});}
  }catch(e){ DB.estoque=[{codigo:"144264",lote:"",galpao:"G1",bloco:"Bloco -01",peso1:"365,76",peso2:"365,76",carga:"",pesoBruto:""}]; }
  save(); render();
}
function doLogin(){
  let u=document.getElementById("lu").value.trim(), s=document.getElementById("lp").value;
  let f=DB.users.find(x=>x.u===u && x.s===s); if(!f){document.getElementById("loginMsg").textContent="Usuário ou senha inválidos"; return;}
  curUser=f; document.getElementById("login").style.display="none"; document.getElementById("app").style.display="block";
  document.getElementById("userLine").textContent="Logado: "+f.nome+" • "+f.perfil+" • Total itens: "+DB.estoque.length;
  render();
}
const TABS=["Consultar","Estoque","Entrada / Saída","Preparar Carga","Mudar Localização","Inventário","Movimentações","Planilha","Usuários"];
function render(){
  let nav=document.getElementById("tabs"); nav.innerHTML=TABS.map(t=>`<button class="${t===tab?'on':''}" onclick="go('${t}')">${t}</button>`).join("");
  let c=document.getElementById("content"); 
  if(tab==="Consultar") c.innerHTML=consultarHTML();
  if(tab==="Estoque") c.innerHTML=estoqueHTML();
  if(tab==="Entrada / Saída") c.innerHTML=formHTML("ent","Entrada / Saída");
  if(tab==="Preparar Carga") c.innerHTML=cargaHTML();
  if(tab==="Mudar Localização") c.innerHTML=formHTML("loc","Mudar Localização")+`<div class="card"><b>Para realocar:</b> bipe a bobina, digite o novo galpão e bloco, Salvar. Não cria item novo, só muda a área.</div>`;
  if(tab==="Inventário") c.innerHTML=inventHTML();
  if(tab==="Movimentações") c.innerHTML=movHTML();
  if(tab==="Planilha") c.innerHTML=planilhaHTML();
  if(tab==="Usuários") c.innerHTML=usuariosHTML();
}
function go(t){tab=t; render();}
function consultarHTML(){
  let list=DB.estoque.filter(x=>(x.codigo||"").includes(filtro)||(x.galpao||"").includes(filtro));
  return `<div class="card"><h2>Consultar</h2><p class="mut">Bipe o QR — em Consultar puxa só o Código para buscar.</p>
  <label>QR / Código</label><input id="con_qr" placeholder="Digite" oninput="filtro=this.value;render()"><button class="btn" onclick="buscarConsultar()">Buscar</button>
  <p class="mut">Total: ${DB.estoque.length} itens • Mostrando ${Math.min(list.length,50)} </p></div>
  <div class="card"><table><tr><th>Código</th><th>Peso</th><th>Galpão / Bloco</th><th></th></tr>${list.slice(0,50).map((x,i)=>`<tr><td>${x.codigo}</td><td>${x.peso1||x.peso2}</td><td>${x.galpao} / ${x.bloco}</td><td><button onclick="moverDe('${x.codigo}')">Mover</button> <button onclick="baixaDe('${x.codigo}')">Baixa</button></td></tr>`).join("")}</table></div>`;
}
function buscarConsultar(){let v=document.getElementById("con_qr").value; let d=parseQR(v); filtro=d?d.codigo:v; render();}
function estoqueHTML(){let list=DB.estoque.filter(x=>(x.codigo||"").includes(filtro)||(x.galpao||"").includes(filtro)); let tot=DB.estoque.reduce((a,x)=>a+parseBR(x.peso1),0);
 return `<div class="card"><h2>Estoque</h2><p>Total itens: <b>${DB.estoque.length}</b> • Peso total: <b>${fmtBR(tot)} kg</b></p><label>Buscar</label><input placeholder="Digite" value="${filtro}" oninput="filtro=this.value;render()"></div><div class="card"><table><tr><th>Código</th><th>Lote / NF</th><th>Galpão</th><th>Bloco</th><th>Peso</th></tr>${list.slice(0,80).map(x=>`<tr><td>${x.codigo}</td><td>${x.lote}</td><td>${x.galpao}</td><td>${x.bloco}</td><td>${x.peso1}</td></tr>`).join("")}</table></div>`;}
function formHTML(p,title){
 return `<div class="card"><h2>${title}</h2><label>Ler QR da etiqueta</label><input id="${p}_qr" placeholder="Digite"><button class="btn btnG" onclick="distribute('${p}')">Distribuir QR</button><p class="mut" id="${p}_msg"></p>
 <div class="row"><div><label>Código</label><input id="${p}_codigo" placeholder="Digite"></div><div><label>Peso</label><input id="${p}_peso" placeholder="Digite"></div></div>
 <div class="row"><div><label>Lote</label><input id="${p}_lote" placeholder="Digite"></div><div><label>NF</label><input id="${p}_nf" placeholder="Digite"></div></div>
 <div class="row"><div><label>Galpão</label><input id="${p}_galpao" placeholder="Digite"></div><div><label>Bloco</label><input id="${p}_bloco" placeholder="Digite"></div></div>
 <button class="btn" onclick="salvarMov('${p}','${title}')">Salvar</button><p class="mut" id="${p}_ok"></p></div>`;
}
function salvarMov(p,title){
 let codigo=document.getElementById(p+"_codigo").value, peso=document.getElementById(p+"_peso").value, lote=document.getElementById(p+"_lote").value, nf=document.getElementById(p+"_nf").value, galpao=document.getElementById(p+"_galpao").value, bloco=document.getElementById(p+"_bloco").value;
 if(!codigo) return alert("Informe o código");
 let ex=DB.estoque.find(x=>x.codigo===codigo);
 if(title==="Mudar Localização" && ex){ ex.galpao=galpao||ex.galpao; ex.bloco=bloco||ex.bloco; DB.movs.push({codigo,peso,lote,nf,galpao,bloco, tipo:"Transferência", data:new Date().toLocaleString("pt-BR"), user:curUser?curUser.nome:""}); save(); document.getElementById(p+"_ok").textContent="Transferência salva — mesma bobina, só mudou a área."; render(); return; }
 if(ex && title==="Entrada / Saída"){ if(!confirm("Bobina já existe em "+ex.galpao+" / "+ex.bloco+". Quer apenas TRANSFERIR para a nova área?")) return; ex.galpao=galpao||ex.galpao; ex.bloco=bloco||ex.bloco; DB.movs.push({codigo,peso,lote,nf,galpao,bloco,tipo:"Transferência",data:new Date().toLocaleString("pt-BR"),user:curUser?curUser.nome:""}); save(); alert("Transferido, não duplicado."); render(); return;}
 DB.estoque.push({codigo,lote: lote||nf, galpao, bloco, peso1:peso, peso2:peso, carga:"", pesoBruto:""}); DB.movs.push({codigo,peso,lote,nf,galpao,bloco,tipo:title,data:new Date().toLocaleString("pt-BR"),user:curUser?curUser.nome:""}); save(); alert("Salvo."); render();
}
function cargaHTML(){
 let totPeso=cargaAtual.reduce((a,x)=>a+parseBR(x.peso),0), totBruto=cargaAtual.reduce((a,x)=>a+parseBR(x.pesoBruto),0);
 return `<div class="card"><h2>Preparar Carga</h2><label>Ler QR da etiqueta</label><input id="car_qr" placeholder="Digite"><button class="btn btnG" onclick="distribute('car')">Distribuir QR</button><p class="mut" id="car_msg"></p>
 <div class="row"><div><label>Código</label><input id="car_codigo" placeholder="Digite"></div><div><label>Peso</label><input id="car_peso" placeholder="Digite"></div></div>
 <div class="row"><div><label>Lote</label><input id="car_lote" placeholder="Digite"></div><div><label>NF</label><input id="car_nf" placeholder="Digite"></div></div>
 <div class="row"><div><label>Galpão</label><input id="car_galpao" placeholder="Digite"></div><div><label>Bloco</label><input id="car_bloco" placeholder="Digite"></div></div>
 <label>Peso Bruto</label><input id="car_bruto" placeholder="Digite">
 <button class="btn" onclick="addCarga()">Adicionar à carga</button></div>
 <div class="card"><h2>Carga — ${cargaAtual.length} itens • Peso total ${fmtBR(totPeso)} kg • Peso Bruto total ${fmtBR(totBruto)} kg</h2>
 <table><tr><th>Código</th><th>Peso</th><th>Peso Bruto</th><th>Lote</th><th>NF</th></tr>${cargaAtual.map((x,i)=>`<tr><td>${x.codigo}</td><td>${x.peso}</td><td><input value="${x.pesoBruto}" onchange="cargaAtual[${i}].pesoBruto=this.value;render()" style="padding:6px"></td><td>${x.lote}</td><td>${x.nf}</td></tr>`).join("")}</table>
 <button class="btn btn2" onclick="salvarCarga()">Salvar carga</button></div>`;
}
function addCarga(){let o={codigo:document.getElementById("car_codigo").value,peso:document.getElementById("car_peso").value,lote:document.getElementById("car_lote").value,nf:document.getElementById("car_nf").value,galpao:document.getElementById("car_galpao").value,bloco:document.getElementById("car_bloco").value,pesoBruto:document.getElementById("car_bruto").value}; if(!o.codigo) return alert("Informe o código"); cargaAtual.push(o); render();}
function salvarCarga(){ if(!cargaAtual.length) return alert("Adicione pelo menos 1 item"); DB.carga.push(...cargaAtual.map(x=>({codigo:x.codigo,lote:x.lote,galpao:x.galpao,bloco:x.bloco,loc:(x.galpao+"/"+x.bloco),peso:x.peso,pesoBruto:x.pesoBruto}))); save(); alert("Carga salva com "+cargaAtual.length+" itens."); cargaAtual=[]; render();}
function inventHTML(){
 return `<div class="card"><h2>Inventário</h2><button class="btn" onclick="biparInvent()">Bipar material / Ler QR</button>
 <label>QR / Código</label><input id="inv_qr" placeholder="Digite"><button class="btn btnG" onclick="confInvent()">Conferir bobina</button>
 <p>Conferidos: <b>${inventConferidos.length}</b></p><table><tr><th>Código</th><th>Peso</th><th>Galpão / Bloco</th></tr>${inventConferidos.map(x=>`<tr><td>${x.codigo}</td><td>${x.peso}</td><td>${x.galpao} / ${x.bloco}</td></tr>`).join("")}</table>
 <button class="btn" onclick="finalizarInvent()">Finalizar inventário da área</button></div>`;
}
function biparInvent(){document.getElementById("inv_qr").focus();}
function confInvent(){let v=document.getElementById("inv_qr").value; let d=parseQR(v); let cod=d?d.codigo:v; let ex=DB.estoque.find(x=>x.codigo===cod); inventConferidos.push({codigo:cod,peso:d?d.peso:(ex?ex.peso1:""),galpao:ex?ex.galpao:"",bloco:ex?ex.bloco:""}); render();}
function finalizarInvent(){ if(!inventConferidos.length) return alert("Bipe pelo menos 1 bobina"); DB.invs.push({data:new Date().toLocaleString("pt-BR"),user:curUser?curUser.nome:"",itens:inventConferidos.slice()}); save(); alert("Inventário salvo com sucesso - "+inventConferidos.length+" bobinas conferidas"); inventConferidos=[]; render();}
function movHTML(){
 return `<div class="card"><h2>Movimentações</h2><button class="btn" onclick="go('Mudar Localização')">Mover material</button><label>Buscar</label><input placeholder="Digite" value="${filtro}" oninput="filtro=this.value;render()">
 <table><tr><th>Data</th><th>Código</th><th>Tipo</th><th>Galpão / Bloco</th><th></th></tr>${DB.movs.slice(-50).reverse().map(m=>`<tr><td>${m.data}</td><td>${m.codigo}</td><td>${m.tipo}</td><td>${m.galpao} / ${m.bloco}</td><td><button onclick="moverDe('${m.codigo}')">Mover</button></td></tr>`).join("")}</table>
 ${DB.movs.length===0?`<p class="mut">Nenhuma movimentação ainda. Toque em Mover material.</p>`:""}</div>`;
}
function moverDe(cod){tab="Mudar Localização"; render(); setTimeout(()=>{let el=document.getElementById("loc_codigo"); if(el) el.value=cod;},100);}
function baixaDe(cod){ if(!confirm("Dar baixa em "+cod+"?")) return; DB.estoque=DB.estoque.filter(x=>x.codigo!==cod); DB.movs.push({codigo:cod,tipo:"Baixa",data:new Date().toLocaleString("pt-BR"),user:curUser?curUser.nome:"",peso:"",lote:"",nf:"",galpao:"",bloco:""}); save(); render();}
function planilhaHTML(){
 let tot=DB.estoque.reduce((a,x)=>a+parseBR(x.peso1),0);
 return `<div class="card"><h2>Planilha</h2><p>Total itens: <b>${DB.estoque.length}</b> • Peso total: <b>${fmtBR(tot)} kg</b> • Carga: <b>${DB.carga.length}</b></p>
 <p class="mut">Para atualizar a base com uma planilha nova, envie a planilha nova aqui no chat que a base é atualizada.</p>
 <button class="btn" onclick="baixarCSV('estoque')">Baixar planilha atualizada - ESTOQUE</button>
 <button class="btn btn2" onclick="baixarCSV('carga')">Baixar planilha atualizada - CARGA</button></div>
 <div class="card"><h2>ESTOQUE — mostrando 100</h2><table><tr><th>Código</th><th>Lote / NF</th><th>Galpão</th><th>Bloco</th><th>Peso 1ª</th><th>Peso 2ª</th><th>Peso Bruto</th></tr>${DB.estoque.slice(0,100).map(x=>`<tr><td>${x.codigo}</td><td>${x.lote}</td><td>${x.galpao}</td><td>${x.bloco}</td><td>${x.peso1}</td><td>${x.peso2}</td><td>${x.pesoBruto||""}</td></tr>`).join("")}</table></div>`;
}
function baixarCSV(tipo){
 let rows = tipo==="estoque" ? DB.estoque.map(x=>[x.codigo,x.lote,x.galpao,x.bloco,x.peso1,x.peso2,"",x.pesoBruto]) : DB.carga.map(x=>[x.codigo,x.lote,x.galpao,x.bloco,x.loc,x.peso,x.pesoBruto]);
 let head = tipo==="estoque" ? "Codigo;Lote_NF;Galpao;Bloco;Peso1;Peso2;Carga;PesoBruto" : "Codigo;Lote_NF;Galpao;Bloco;Localizacao;PesoConfirmado;PesoBruto";
 let csv=head+"\n"+rows.map(r=>r.join(";")).join("\n");
 let b=new Blob(["\ufeff"+csv],{type:"text/csv"}); let a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download="tecnoval_"+tipo+"_atualizada.csv"; a.click();
}
function usuariosHTML(){
 return `<div class="card"><h2>Usuários</h2><table><tr><th>Nome</th><th>Usuário</th><th>Perfil</th></tr>${DB.users.map(u=>`<tr><td>${u.nome}</td><td>${u.u}</td><td>${u.perfil}</td></tr>`).join("")}</table>
 <label>Nome</label><input id="nu_nome" placeholder="Digite"><label>Usuário</label><input id="nu_u" placeholder="Digite"><label>Senha</label><input id="nu_s" placeholder="Digite">
 <button class="btn" onclick="addUser()">Cadastrar usuário</button></div>
 <div class="card"><h2>Trocar minha senha</h2><label>Senha atual</label><input id="pw_old" type="password" placeholder="Digite"><label>Nova senha</label><input id="pw_new" type="password" placeholder="Digite"><button class="btn btn2" onclick="changePw()">Trocar senha</button></div>`;
}
function addUser(){let nome=document.getElementById("nu_nome").value, u=document.getElementById("nu_u").value, s=document.getElementById("nu_s").value; if(!nome||!u||!s) return alert("Preencha todos"); DB.users.push({u,s,nome,perfil:"Operador"}); save(); alert("Usuário cadastrado"); render();}
function changePw(){let old=document.getElementById("pw_old").value, nw=document.getElementById("pw_new").value; if(curUser.s!==old) return alert("Senha atual incorreta"); if(nw.length<4) return alert("Nova senha precisa de no mínimo 4 caracteres"); curUser.s=nw; save(); alert("Senha trocada");}
loadCSV();
</script></body></html>
